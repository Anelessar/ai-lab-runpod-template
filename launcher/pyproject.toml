[project]
name = "ai-lab-launcher"
version = "0.1.0"
description = "Disposable RunPod launcher for ComfyUI and standalone AI tools"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
