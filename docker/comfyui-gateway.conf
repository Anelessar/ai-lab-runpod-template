server {
    listen 8188 default_server;
    listen [::]:8188 default_server;
    server_name _;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 2s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_intercept_errors on;
        error_page 502 503 504 = @starting;
    }

    location @starting {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="2"><title>ComfyUI запускается</title><style>body{margin:0;background:#0e0e14;color:#f4f2ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{padding:28px 32px;border:1px solid #2d2d3c;border-radius:16px;background:#15151f;box-shadow:0 16px 50px #0006}h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#aaa6bd}</style></head><body><div class="card"><h1>ComfyUI запускается…</h1><p>GPU и модели инициализируются. Страница обновится автоматически.</p></div></body></html>';
    }
}
