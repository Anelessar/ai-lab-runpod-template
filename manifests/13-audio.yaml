tools:
  - id: omnivoice
    name: OmniVoice
    category: "13 · Speech and audio generation"
    kind: standalone
    description: Massively multilingual zero-shot TTS для 600+ языков с cloning, voice design и pronunciation control.
    source_url: https://github.com/k2-fsa/OmniVoice
    repo_url: https://github.com/k2-fsa/OmniVoice
    priority: must
    adapter_status: ready
    requirements: ["NVIDIA GPU рекомендуется"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + language/reference voice → OmniVoice → WAV → ASR QA"
    install: {mode: git-auto, instructions: "Официальный пакет устанавливается в отдельное uv-окружение."}
    models: {mode: manual, instructions: "Первый запуск скачивает нужные checkpoints; при gated моделях передать HF_TOKEN через RunPod Secret."}
    launch:
      mode: process
      command: "omnivoice-demo --ip 0.0.0.0 --port {port}"
      port: 8001

  - id: moss-tts-1-5
    name: MOSS-TTS v1.5
    category: "13 · Speech and audio generation"
    kind: standalone
    description: Локальный multilingual TTS на 31 язык с voice cloning, prosody/pause control и длинными references.
    source_url: https://github.com/OpenMOSS/MOSS-TTS
    repo_url: https://github.com/OpenMOSS/MOSS-TTS
    priority: must
    adapter_status: catalogued
    requirements: ["мощная NVIDIA GPU"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + language/style/reference → MOSS-TTS → 48 kHz WAV → QA"
    install: {mode: git-auto, instructions: "Официальный Transformers/Gradio stack ставится в изолированное окружение."}
    models: {mode: manual, instructions: "Скачать MOSS-TTS-v1.5 либо Local-Transformer-v1.5 по README."}
    launch: {mode: disabled}

  - id: indextts-2-5
    name: IndexTTS-2.5
    category: "13 · Speech and audio generation"
    kind: standalone
    description: 0.8B zero-shot voice cloning TTS для Chinese, English, Japanese, Spanish и Arabic с emotion, speed и pronunciation controls.
    source_url: https://huggingface.co/IndexTeam/IndexTTS-2.5
    repo_url: https://github.com/index-tts/index-tts
    ref: 4f8792ff120cd3ea470dd511e997a17c86cddd10
    priority: must
    adapter_status: ready
    license_note: Специальная Bilibili Model Use License; перед коммерческой работой проверить условия и при необходимости связаться с командой.
    requirements: ["около 6 GB VRAM", "CUDA 12.8 рекомендуется"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + language + approved voice reference + emotion/speed → WAV → Qwen3-ASR QA"
    install:
      mode: git-auto
      commands: ["uv sync --all-extras"]
      instructions: "Закреплённый официальный commit и uv lock устанавливаются автоматически."
    models:
      mode: huggingface
      repo_ids: [IndexTeam/IndexTTS-2.5]
      instructions: "Checkpoint скачивается в отдельную model-папку; small auxiliary models догружаются при первом старте."
      size_gb: 6
    launch:
      mode: process
      command: "GRADIO_SERVER_NAME=0.0.0.0 GRADIO_SERVER_PORT={port} AI_LAB_INDEX_MODEL_DIR='{model_dir}/IndexTeam--IndexTTS-2.5' uv run webui.py --model_dir '{model_dir}/IndexTeam--IndexTTS-2.5'"
      port: 7860

  - id: midashenglm-gen
    name: MiDashengLM-Gen
    category: "13 · Speech and audio generation"
    kind: standalone
    description: 3B text-to-audio модель Xiaomi, создающая единый variable-length mix речи, музыки, SFX и окружения на девяти языках.
    source_url: https://xingws.github.io/midashenglm-gen-demo/
    repo_url: https://github.com/xiaomi-research/midashenglm-gen
    ref: fcebd304948d146fc37616b28a5d781edba5408d
    priority: must
    adapter_status: ready
    license_note: Apache 2.0 с ограничениями на незаконное, вредоносное, нарушающее права и военное применение.
    requirements: ["NVIDIA GPU", "выход 16 kHz mono"]
    inputs: [text]
    outputs: [audio]
    pipeline: "structured scene/speech/music/SFX prompt → MiDashengLM-Gen → mono WAV → QA"
    install:
      mode: git-auto
      commands: ["uv sync"]
      instructions: "Закреплённый официальный commit устанавливается через uv."
    models:
      mode: huggingface
      repo_ids: [mispeech/midashenglm-gen]
      instructions: "Скачивается официальный Transformers checkpoint."
    launch: {mode: disabled}
    run:
      mode: command
      command: "uv run python '{template_root}/adapters/run_midasheng.py' --model '{model_dir}/mispeech--midashenglm-gen' --text {scene_prompt} --output '{output_dir}/midasheng-{timestamp}.wav'"
      fields:
        - {name: scene_prompt, label: Structured audio-scene prompt, type: textarea}

  - id: longcat-audiodit
    name: LongCat-AudioDiT 1B
    category: "13 · Speech and audio generation"
    kind: standalone
    description: Компактная diffusion speech/audio модель с voice cloning.
    source_url: https://github.com/meituan-longcat/LongCat-AudioDiT
    repo_url: https://github.com/meituan-longcat/LongCat-AudioDiT
    priority: mid
    adapter_status: catalogued
    requirements: ["NVIDIA GPU"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + reference voice → LongCat-AudioDiT → WAV → QA"
    install: {mode: git-auto, instructions: "Официальный inference repo ставится отдельно."}
    models: {mode: manual, instructions: "Скачать checkpoint по README и передавать reference audio явно."}
    launch: {mode: disabled}

  - id: miotts
    name: MioTTS-2.6B
    category: "13 · Speech and audio generation"
    kind: standalone
    description: Zero-shot voice cloning для English и Japanese.
    source_url: https://huggingface.co/Aratako/MioTTS-2.6B
    priority: mid
    adapter_status: manual
    requirements: ["NVIDIA GPU"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + approved voice reference → MioTTS → WAV → QA"
    install: {mode: manual, instructions: "Использовать Python/Gradio instructions из model card; отдельный официальный installer repo не указан."}
    models: {mode: manual, instructions: "Скачать Aratako/MioTTS-2.6B вручную."}
    launch: {mode: disabled}

  - id: tada
    name: TADA 1B / 3B
    category: "13 · Speech and audio generation"
    kind: standalone
    description: "Speech continuation/TTS checkpoints Hume: 1B для English и 3B multilingual."
    source_url: https://www.hume.ai/blog/opensource-tada
    priority: mid
    adapter_status: manual
    requirements: ["NVIDIA GPU либо edge-устройство для 1B"]
    inputs: [text, audio]
    outputs: [audio]
    pipeline: "text + optional speech context → TADA → WAV → QA"
    install: {mode: manual, instructions: "Установить официальный inference, на который ссылается Hume; repo URL нужно фиксировать после выбора 1B/3B."}
    models: {mode: manual, instructions: "Выбрать и скачать 1B либо 3B checkpoint."}
    launch: {mode: disabled}

  - id: vibevoice-realtime
    name: VibeVoice-Realtime 0.5B
    category: "13 · Speech and audio generation"
    kind: standalone
    description: Компактный streaming TTS Microsoft для low-latency voice previews и realtime avatar prototypes.
    source_url: https://github.com/microsoft/VibeVoice
    repo_url: https://github.com/microsoft/VibeVoice
    priority: mid
    adapter_status: catalogued
    requirements: ["NVIDIA GPU рекомендуется"]
    inputs: [text]
    outputs: [audio]
    pipeline: "streaming text → VibeVoice → audio chunks → WAV/player"
    install: {mode: git-auto, instructions: "Официальный realtime inference ставится отдельно."}
    models: {mode: manual, instructions: "Скачать VibeVoice-Realtime 0.5B и experimental voices по README."}
    launch: {mode: disabled}

  - id: qwen3-asr
    name: Qwen3-ASR 1.7B / 0.6B
    category: "14 · Transcription and restoration"
    kind: standalone
    description: Локальный ASR на 52 языка/диалекта с отдельным ForcedAligner для точных timestamps.
    source_url: https://github.com/QwenLM/Qwen3-ASR
    repo_url: https://github.com/QwenLM/Qwen3-ASR
    priority: must
    adapter_status: catalogued
    requirements: ["NVIDIA GPU для быстрого inference"]
    inputs: [audio, video]
    outputs: [text, json]
    pipeline: "audio/video → Qwen3-ASR → transcript → ForcedAligner → subtitles/JSON"
    install: {mode: git-auto, instructions: "Официальный qwen-asr package/репозиторий ставится отдельно."}
    models: {mode: manual, instructions: "Скачать 1.7B либо 0.6B и ForcedAligner checkpoint по README."}
    launch: {mode: disabled}

  - id: lavasr-v2
    name: LavaSR v2
    category: "14 · Transcription and restoration"
    kind: standalone
    description: Лёгкое speech restoration/super-resolution до 48 kHz, работающее также на CPU.
    source_url: https://github.com/ysharma3501/LavaSR
    repo_url: https://github.com/ysharma3501/LavaSR
    priority: must
    adapter_status: catalogued
    requirements: ["около 500 MB VRAM либо CPU"]
    inputs: [audio]
    outputs: [audio]
    pipeline: "плохой speech → LavaSR v2 → restored 48 kHz WAV → ASR/A-B QA"
    install: {mode: git-auto, instructions: "Официальный Python inference ставится отдельно; ComfyUI не обязателен."}
    models: {mode: manual, instructions: "Скачать LavaSR v2 checkpoint по README."}
    launch: {mode: disabled}
