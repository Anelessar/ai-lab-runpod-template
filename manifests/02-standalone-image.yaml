# Standalone image tools.
#
# `verified` is evidence, not intent:
#   catalogued   - documented here, but setup is manual
#   installable  - AI Lab automates install/weights with the commands the pinned
#                  commit documents for itself; GPU launch not yet performed
#   launchable   - launch command reached its health check in a Pod
#   smoke-tested - a real run produced an artifact
tools:
  - id: ideogram-4
    name: Ideogram 4
    category: "1 · Image generation"
    kind: comfyui
    description: Открытая 9.3B text-to-image модель Ideogram для типографики, сложного layout, JSON-промптов, цветовых палитр и изображений до 2K.
    source_url: https://github.com/ideogram-oss/ideogram4
    repo_url: https://github.com/ideogram-oss/ideogram4
    priority: must
    access: free
    adapter_status: ready
    verified: catalogued
    license_note: Код Apache-2.0; веса Ideogram 4 доступны после принятия gated Non-Commercial лицензии. Для коммерческого использования нужна отдельная лицензия Ideogram.
    requirements: ["24 GB VRAM для NF4", "HF_TOKEN и принятая лицензия модели"]
    inputs: [text, json]
    outputs: [image]
    pipeline: "обычный prompt → Magic Prompt/свой LLM → structured JSON → Ideogram 4 NF4 → PNG → общая галерея"
    install: {mode: disabled, instructions: "Официальная поддержка уже входит в актуальный ComfyUI; отдельный Python-интерфейс для теста не нужен."}
    models: {mode: manual, instructions: "Открыть выбранный workflow и скачать указанные в нём Ideogram 4 checkpoint/encoders в соответствующие папки ComfyUI. Для gated-весов сначала принять лицензию на Hugging Face."}
    launch: {mode: comfyui}
    workflows:
      - {name: ideogram4_t2i, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_ideogram4_t2i.json}
      - {name: ideogram4_t2i_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_ideogram4_t2i_int8.json}

  - id: mage-flow
    name: Mage-Flow / Mage-Flow-Edit
    category: "1 · Image generation"
    kind: comfyui
    description: Компактная линейка Microsoft для text-to-image и instruction editing, включая четырёхшаговые Turbo checkpoints.
    source_url: https://microsoft.github.io/Mage/flow/
    repo_url: https://github.com/microsoft/Mage
    priority: must
    adapter_status: ready
    verified: catalogued
    requirements: ["18–20 GB VRAM для BF16", "NVIDIA GPU"]
    inputs: [text, image]
    outputs: [image]
    pipeline: "prompt/image + инструкция → Mage checkpoint → PNG → ComfyUI"
    install: {mode: disabled, instructions: "Официальные workflow работают в актуальном ComfyUI; отдельную программу Mage для первого теста ставить не нужно."}
    models: {mode: manual, instructions: "Открыть workflow и скачать указанные в нём INT8 checkpoint, text encoder и VAE в соответствующие папки ComfyUI."}
    launch: {mode: comfyui}
    workflows:
      - {name: mage_flow_t2i_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_mage_flow_t2i_int8.json}
      - {name: mage_flow_turbo_t2i_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_mage_flow_turbo_t2i_int8.json}
      - {name: mage_flow_edit_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_mage_flow_edit_int8.json}
      - {name: mage_flow_edit_turbo_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_mage_flow_edit_turbo_int8.json}

  - id: ernie-image
    name: ERNIE-Image 8B / Turbo
    category: "1 · Image generation"
    kind: comfyui
    description: Локальная image-модель Baidu с сильным текстом/layout и быстрой Turbo-веткой.
    source_url: https://github.com/baidu/ernie-image
    repo_url: https://github.com/baidu/ernie-image
    priority: mid
    adapter_status: ready
    verified: catalogued
    requirements: ["NVIDIA GPU"]
    inputs: [text]
    outputs: [image]
    pipeline: "prompt → ERNIE Turbo/full → OCR → PNG → ComfyUI"
    install: {mode: disabled, instructions: "Официальная поддержка уже входит в актуальный ComfyUI; отдельную программу устанавливать не нужно."}
    models: {mode: manual, instructions: "Открыть workflow и скачать full либо Turbo checkpoint и остальные указанные файлы в соответствующие папки ComfyUI."}
    launch: {mode: comfyui}
    workflows:
      - {name: ernie_image_8b, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_ernie_image.json}
      - {name: ernie_image_turbo, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_ernie_image_turbo.json}

  - id: redesign
    name: ReDesign
    category: "2 · Image editing"
    kind: standalone
    description: Агентный pipeline, превращающий flattened raster design в иерархию текста, объектов и редактируемых слоёв.
    source_url: https://github.com/jintae-00/ReDesign
    repo_url: https://github.com/jintae-00/ReDesign
    ref: 5023ec3aca2b6c39876c34cc7f1d30a85f70396d
    priority: must
    adapter_status: manual
    verified: catalogued
    license_spdx: NOASSERTION
    license_note: Лицензия в репозитории не сводится к стандартной SPDX-строке; проверить LICENSE перед любым использованием.
    entrypoint: "conda env create -f environment.yml && bash post_install.sh && python -m ReDesign.run_single_image"
    vram_gb: 80
    requirements: ["80 GB-class GPU", "локальный или OpenAI-compatible VLM endpoint"]
    inputs: [image]
    outputs: [image, layers, json]
    pipeline: "design PNG → OCR/VLM/segmentation/Qwen Layered → JSON + layers"
    install:
      mode: manual
      instructions: "Официальная установка — conda environment.yml плюс post_install.sh, который доставляет PyTorch cu128, PaddlePaddle, diffusers из git, sam2 и CUDA-расширение GroundingDINO. Это не воспроизводится в изолированном uv-окружении AI Lab, поэтому кнопки установки нет: ставить вручную в Pod."
    models:
      mode: manual
      instructions: "python scripts/download_checkpoints.py --with-qwen скачивает tool/eval checkpoints и Qwen-Image-Layered. Дополнительно нужен OpenAI-совместимый VLM endpoint, прописанный в config.py."
    launch: {mode: disabled}

  - id: spatialedit
    name: SpatialEdit
    category: "2 · Image editing"
    kind: standalone
    description: 16B checkpoint для перемещения, вращения и изменения viewpoint отдельных объектов.
    source_url: https://github.com/EasonXiao-888/SpatialEdit
    repo_url: https://github.com/EasonXiao-888/SpatialEdit
    ref: 8b0b3519e88a7f91213f8ad4cf079f8f27f1d91d
    priority: must
    adapter_status: catalogued
    verified: installable
    license_spdx: MIT
    license_note: Код MIT; веса SpatialEdit-16B, Qwen3-VL-8B-Instruct и Wan2.1 под собственными лицензиями — проверить каждую отдельно.
    entrypoint: "python spatialedit_demo.py (демо без аргументов; AI Lab вызывает ту же последовательность через adapters/run_spatialedit.py)"
    vram_gb: 48
    download_gb: 60
    requirements: ["мощная NVIDIA GPU", "сборка flash_attn при установке", "три отдельных набора весов"]
    inputs: [image, text]
    outputs: [image]
    pipeline: "фото + инструкция про поворот/перемещение объекта → SpatialEdit → PNG в runs/"
    install:
      mode: git-auto
      python_version: "3.10"
      commands:
        - "uv venv '{env_dir}' --python 3.10"
        - "uv pip install --python '{env_dir}/bin/python' --torch-backend cu128 -r requirements.txt"
        - "uv pip install --python '{env_dir}/bin/python' --torch-backend cu128 accelerate peft pillow"
      instructions: "requirements.txt тянет flash_attn, который собирается под фактическую GPU — первая установка занимает десятки минут. Честная оговорка: adapters/run_spatialedit.py повторяет ту же последовательность загрузки и inference, что и официальный spatialedit_demo.py, но на GPU он ещё не прогонялся — для этого нужны все 60 GB весов. Поэтому статус installable, а не launchable."
    models:
      mode: huggingface
      repo_ids:
        - EasonXiao-888/SpatialEdit-16B
        - Qwen/Qwen3-VL-8B-Instruct
        - Wan-AI/Wan2.1-T2V-1.3B
      size_gb: 60
      check:
        - "EasonXiao-888--SpatialEdit-16B"
        - "Qwen--Qwen3-VL-8B-Instruct"
        - "Wan-AI--Wan2.1-T2V-1.3B"
      instructions: "Нужны три набора: сам SpatialEdit-16B (CKPT_PT.pth и CKPT_CT_lora), Qwen3-VL-8B-Instruct как vision-language backbone и Wan2.1_VAE.pth из Wan2.1-T2V-1.3B. Пути к ним AI Lab подставляет в конфиг сам — править your_base_path в файлах репозитория не нужно."
    launch: {mode: disabled}
    run:
      mode: command
      command: "'{env_dir}/bin/python' '{template_root}/adapters/run_spatialedit.py' --image {image} --prompt {prompt} --model-dir '{model_dir}' --device cuda:0 --steps {steps} --output '{output_dir}/spatialedit.png'"
      timeout_s: 7200
      smoke_command: "'{env_dir}/bin/python' '{template_root}/adapters/run_spatialedit.py' --help"
      fields:
        - {name: image, label: Фото, type: file}
        - {name: prompt, label: Что сделать с объектом, type: textarea, help: "Например: Rotate the dog to show the front left side view."}
        - {name: steps, label: Шагов, type: number, required: false, default: "30"}

  - id: hifi-inpaint
    name: HiFi-Inpaint
    category: "2 · Image editing"
    kind: standalone
    description: Reference-guided inpainting с отдельными condition image, mask и prompt.
    source_url: https://github.com/Correr-Zhou/HiFi-Inpaint
    repo_url: https://github.com/Correr-Zhou/HiFi-Inpaint
    ref: 606a21e7e15247b14047d4993e778259a47ce0d0
    priority: must
    adapter_status: catalogued
    verified: installable
    license_spdx: Apache-2.0
    license_note: Код Apache-2.0; базовая FLUX-модель под собственной лицензией BFL — проверить перед коммерческим использованием.
    entrypoint: "python inference.py --base_model_path ... --lora_path ... --ref_image ... --mask_image ... --output ..."
    requirements: ["NVIDIA GPU", "базовая FLUX-модель"]
    inputs: [image, mask, reference, text]
    outputs: [image]
    pipeline: "image + mask + reference + prompt → HiFi-Inpaint → PNG"
    install:
      mode: git-auto
      python_version: "3.11"
      instructions: "Закреплённый commit и requirements.txt ставятся в отдельное uv-окружение."
    models:
      mode: manual
      instructions: "Нужны базовая FLUX-модель и LoRA HiFi-Inpaint; README не публикует прямых ссылок с фиксированными путями, поэтому пути указываются в форме запуска вручную."
    launch: {mode: disabled}
    run:
      mode: command
      command: "'{env_dir}/bin/python' inference.py --base_model_path {base_model_path} --lora_path {lora_path} --ref_image {ref_image} --mask_image {mask_image} --prompt {prompt} --output '{output_dir}/hifi-inpaint.png'"
      fields:
        - {name: base_model_path, label: Путь к базовой FLUX-модели, type: text, help: "Каталог или .safetensors внутри Pod"}
        - {name: lora_path, label: Путь к HiFi-Inpaint LoRA, type: text}
        - {name: ref_image, label: Reference image, type: file}
        - {name: mask_image, label: Маска, type: file}
        - {name: prompt, label: Prompt, type: textarea, required: false, default: " "}

  - id: hunyuanimage-3-instruct
    name: HunyuanImage-3.0-Instruct
    category: "2 · Image editing"
    kind: standalone
    description: Большая instruction-based image модель Tencent для сложных правок и multi-GPU inference.
    source_url: https://huggingface.co/tencent/HunyuanImage-3.0-Instruct
    priority: must
    adapter_status: manual
    verified: catalogued
    entrypoint: "официальный inference-код из model card"
    requirements: ["несколько мощных GPU"]
    inputs: [image, text]
    outputs: [image]
    pipeline: "image + инструкция → HunyuanImage Instruct → PNG → QA"
    install:
      mode: manual
      instructions: "Отдельного репозитория с installer нет — только inference-код в model card, рассчитанный на multi-GPU. Одноразовый Pod AI Lab с одной GPU для него не подходит."
    models: {mode: manual, instructions: "Скачать checkpoint с Hugging Face вручную после проверки требований к GPU."}
    launch: {mode: disabled}

  - id: windowseat
    name: WindowSeat v1.0
    category: "2 · Image editing"
    kind: standalone
    description: Узкая модель удаления отражений со стекла и окон.
    source_url: https://huggingface.co/huawei-bayerlab/windowseat-reflection-removal-v1-0
    repo_url: https://github.com/huawei-bayerlab/windowseat-reflection-removal
    ref: 68948e8269b46c507435213669f63e46f1875493
    priority: must
    adapter_status: catalogued
    verified: installable
    license_spdx: Apache-2.0
    license_note: Код и LoRA Apache-2.0; базовая Qwen-Image-Edit-2509 под собственной лицензией Qwen.
    entrypoint: "python windowseat_inference.py --input-dir ... --output-dir ..."
    download_gb: 40
    requirements: ["NVIDIA GPU", "базовая Qwen-Image-Edit-2509 скачивается автоматически"]
    inputs: [image]
    outputs: [image]
    pipeline: "фото через стекло → WindowSeat → PNG без отражений в runs/ (плюс comparison и alternating-видео)"
    install:
      mode: git-auto
      python_version: "3.12"
      commands:
        - "uv venv '{env_dir}' --python 3.12"
        - "uv pip install --python '{env_dir}/bin/python' --torch-backend cu128 -r requirements.max.txt"
      instructions: "environment.yaml в репозитории — conda, но реальные зависимости в нём это обычный requirements.max.txt, поэтому uv ставит всё сам, без conda."
    models:
      mode: disabled
      instructions: "Отдельная кнопка не нужна: windowseat_inference.py тянет базовую Qwen-Image-Edit-2509 и LoRA huawei-bayerlab/windowseat-reflection-removal-v1-0 через from_pretrained в общий кэш HF_HOME при первом запуске. Скрипт принимает только свой список поддерживаемых базовых моделей, поэтому подменять путь на локальный AI Lab не станет."
    launch: {mode: disabled}
    run:
      mode: command
      # Инструмент батчевый: он читает папку целиком. Кладём выбранное фото в
      # отдельную input-папку этого запуска, чтобы результат и вход лежали рядом.
      command: "mkdir -p '{output_dir}/input' && cp {image} '{output_dir}/input/' && '{env_dir}/bin/python' windowseat_inference.py --input-dir '{output_dir}/input' --output-dir '{output_dir}' --device cuda"
      timeout_s: 3600
      smoke_command: "'{env_dir}/bin/python' windowseat_inference.py --help"
      fields:
        - {name: image, label: Фото через стекло, type: file}

  - id: vibe-2b
    name: VIBE 2B
    category: "2 · Image editing"
    kind: standalone
    description: Компактный instruction-based image editor с открытыми Hugging Face checkpoints.
    source_url: https://riko0.github.io/VIBE/
    priority: must
    adapter_status: manual
    verified: catalogued
    entrypoint: "inference-сниппет из model card / Hugging Face Space"
    requirements: ["NVIDIA GPU"]
    inputs: [image, text]
    outputs: [image]
    pipeline: "image + инструкция → VIBE → PNG → comparison"
    install:
      mode: manual
      instructions: "У проекта есть страница и веса на Hugging Face, но нет репозитория с inference-кодом, который можно закрепить commit-ом: страница отправляет в Hugging Face Space. Прежде чем делать кнопку, нужно зафиксировать источник кода."
    models: {mode: manual, instructions: "Скачать iitolstykh/VIBE-Image-Edit либо DistilledCFG checkpoint."}
    launch: {mode: disabled}

  - id: unigenddet
    name: UniGenDet
    category: "2 · Image editing"
    kind: standalone
    description: Unified generation/detection research pipeline, полезный как специализированная evaluation/editing ветка.
    source_url: https://github.com/Zhangyr2022/UniGenDet
    repo_url: https://github.com/Zhangyr2022/UniGenDet
    ref: 94e039dec7c255998900f134b3a7ca3447e8f08e
    priority: must
    adapter_status: catalogued
    verified: installable
    license_spdx: MIT
    license_note: Код MIT; BAGEL-7B-MoT под собственной лицензией ByteDance-Seed.
    entrypoint: "python demo.py --mode t2i|detection --model_path ./pretrained/bagel_7b_mot --output_dir ..."
    download_gb: 29
    requirements: ["BAGEL-7B-MoT checkpoint", "NVIDIA GPU", "сборка flash_attn при установке"]
    inputs: [text, image]
    outputs: [image, json]
    pipeline: "prompt/image → UniGenDet generation/detection mode → PNG/JSON"
    install:
      mode: git-auto
      python_version: "3.10"
      commands:
        - "uv venv '{env_dir}' --python 3.10"
        - "uv pip install --python '{env_dir}/bin/python' --torch-backend cu128 -r requirements.txt"
        - "uv pip install --python '{env_dir}/bin/python' --no-build-isolation flash_attn==2.5.8"
      instructions: "flash_attn собирается из исходников под фактическую GPU — первая установка занимает десятки минут."
    models:
      mode: huggingface
      repo_ids: [ByteDance-Seed/BAGEL-7B-MoT]
      size_gb: 29
      check: ["ByteDance-Seed--BAGEL-7B-MoT"]
      instructions: "demo.py по умолчанию ждёт ./pretrained/bagel_7b_mot; AI Lab передаёт путь к скачанной копии через --model_path."
    launch: {mode: disabled}
    run:
      mode: command
      command: "'{env_dir}/bin/python' demo.py --mode {mode} --model_path '{model_dir}/ByteDance-Seed--BAGEL-7B-MoT' --prompt {prompt} --output_dir '{output_dir}'"
      fields:
        - {name: mode, label: Режим, type: select, choices: [t2i, detection], default: t2i}
        - {name: prompt, label: Prompt, type: textarea}

  - id: gen-searcher
    name: GenSearcher
    category: "3 · Image evaluation and search"
    kind: web
    description: Web-only поиск/сравнение генеративных результатов; локальной модели и API-интеграции не требует.
    source_url: https://gen-searcher.vercel.app/
    priority: must
    adapter_status: ready
    verified: catalogued
    inputs: [text]
    outputs: [data]
    pipeline: "поисковый запрос → web UI → сохранить находки в brief"
    install: {mode: disabled, instructions: "Работает в браузере."}
    models: {mode: disabled, instructions: "Моделей нет."}
    launch: {mode: web}
