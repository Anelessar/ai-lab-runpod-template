  - id: mrflow
    name: MrFlow
    category: "12 · Acceleration"
    kind: modifier
    description: Training-free multi-resolution acceleration для поддерживаемых image flow/diffusion моделей.
    source_url: https://github.com/Xingyu-Zheng/MrFlow
    priority: mid
    adapter_status: manual
    requirements: ["поддерживаемая Qwen/Image base"]
    inputs: [text, image]
    outputs: [image]
    pipeline: "обычный prompt/conditions → MrFlow sampler → A/B quality test"
    install: {mode: manual, instructions: "Скопировать официальный ComfyUI-MrFlow plugin и установить его зависимости."}
    models: {mode: manual, instructions: "Использует модель базового workflow; отдельный универсальный checkpoint отсутствует."}
