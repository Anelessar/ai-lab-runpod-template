      - {name: qwen_edit_2511_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_qwen_image_edit_2511_int8.json}
      - {name: qwen_edit_2511_inflation_lora, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image-qwen_image_edit_2511_lora_inflation.json}

  - id: qwen-image-layered
    name: Qwen-Image-Layered
    category: "2 · Image editing"
    kind: comfyui
    description: Декомпозиция плоского изображения на отдельные RGBA-слои.
    source_url: https://huggingface.co/Qwen/Qwen-Image-Layered
    priority: must
    adapter_status: ready
    requirements: ["мощная NVIDIA GPU"]
    inputs: [image]
    outputs: [image, layers]
    pipeline: "flattened image → Qwen Layered → RGBA layers → ReDesign/ручная правка"
    install: {mode: disabled, instructions: "Использует core nodes актуального ComfyUI."}
    models: {mode: manual, instructions: "Скачать layered checkpoint и зависимости по ссылкам workflow."}
    launch: {mode: comfyui}
