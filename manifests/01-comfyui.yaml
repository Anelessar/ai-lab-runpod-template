  - id: genfocus
    name: Genfocus
    category: "2 · Image editing"
    kind: modifier
    description: Специализированный deblur/refocus/bokeh pipeline для исправления глубины резкости.
    source_url: https://github.com/rayray9999/Genfocus
    repo_url: https://github.com/rayray9999/Genfocus
    priority: must
    adapter_status: manual
    requirements: ["comfyui-refocus custom node"]
    inputs: [image]
    outputs: [image]
    pipeline: "image → DeblurNet/BokehNet → refocused image"
    install: {mode: manual, instructions: "Установить comfyui-refocus через ComfyUI Manager по инструкции авторов."}
    models: {mode: manual, instructions: "Скачать DeblurNet/BokehNet checkpoints, указанные репозиторием."}
    launch: {mode: comfyui}
    workflows:
      - {name: genfocus_deblur_simple, url: https://raw.githubusercontent.com/EricRollei/comfyui-refocus/main/workflows/Deblur_Eric_1225_simple.json}
      - {name: genfocus_refocus, url: https://raw.githubusercontent.com/EricRollei/comfyui-refocus/main/workflows/Refocus-Eric-1225.json}
      - {name: genfocus_advanced_conditions, url: https://raw.githubusercontent.com/EricRollei/comfyui-refocus/main/workflows/workflow_advanced_conditions.json}

