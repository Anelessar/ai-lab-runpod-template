  - id: flashportrait
    name: FlashPortrait
    category: "8 · Video control and animation"
    kind: modifier
    description: Identity-preserving portrait animation для длинных talking portraits.
    source_url: https://francis-rings.github.io/FlashPortrait/
    priority: must
    adapter_status: manual
    requirements: ["Wan2.1-I2V-14B", "community ComfyUI node"]
    inputs: [image, video]
    outputs: [video]
    pipeline: "portrait + driving video → FlashPortrait → face QA → MP4"
