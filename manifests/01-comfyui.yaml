tools:
  - id: z-image
    name: Z-Image / Turbo
    category: "1 · Image generation"
    kind: comfyui
    description: Компактная локальная text-to-image модель; полный checkpoint нужен для качества и LoRA, Turbo — для быстрых итераций.
    source_url: https://github.com/Tongyi-MAI/Z-Image
    priority: must
    adapter_status: ready
    requirements: ["16+ GB VRAM для Turbo", "NVIDIA GPU"]
    inputs: [text]
    outputs: [image]
    pipeline: "prompt → Z-Image/Turbo → VAE Decode → PNG → общая галерея"
    install: {mode: disabled, instructions: "Поддержка входит в актуальный ComfyUI."}
    models: {mode: manual, instructions: "Скачать diffusion model, Qwen text encoder и VAE через Hugging Face Download Manager в папки, указанные внутри workflow."}
    launch: {mode: comfyui}
    workflows:
      - {name: image_z_image, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_z_image.json}
      - {name: image_z_image_turbo, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_z_image_turbo.json}
      - {name: image_z_image_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_z_image_int8.json}
      - {name: image_z_image_turbo_int8, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_z_image_turbo_int8.json}
      - {name: image_z_image_turbo_union_controlnet, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_z_image_turbo_fun_union_controlnet.json}

  - id: qwen-image-2512
    name: Qwen-Image-2512
    category: "1 · Image generation"
    kind: comfyui
    description: Открытая 20B text-to-image модель для реалистичных людей, сложных prompts и текста в изображении.
    source_url: https://huggingface.co/Qwen/Qwen-Image-2512
    priority: must
    adapter_status: ready
    requirements: ["мощная NVIDIA GPU", "quantization при недостатке VRAM"]
    inputs: [text]
    outputs: [image]
    pipeline: "prompt → Qwen-Image-2512 → OCR/SKU QA → PNG"
    install: {mode: disabled, instructions: "Использует core nodes актуального ComfyUI."}
    models: {mode: manual, instructions: "Скачать файлы из Qwen/Comfy-Org через Hugging Face Download Manager по ссылкам внутри workflow."}
    launch: {mode: comfyui}
    workflows:
      - {name: image_qwen_2512, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_qwen_Image_2512.json}
      - {name: image_qwen_2512_controlnet, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_qwen_Image_2512_controlnet.json}
      - {name: image_qwen_2512_2step_lora, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_qwen_image_2512_with_2steps_lora.json}

  - id: flux2-klein
    name: FLUX.2 Klein
    category: "1 · Image generation"
    kind: comfyui
    description: Локальная быстрая ветка FLUX.2 для генерации и редактирования; Pro/Max/Flex в этот бесплатный runtime не входят.
    source_url: https://help.bfl.ai/articles/7655484417-what-flux-models-are-available
    priority: must
    adapter_status: ready
    requirements: ["NVIDIA GPU"]
    inputs: [text, image]
    outputs: [image]
    pipeline: "prompt/references → FLUX.2 Klein → QA → PNG"
    install: {mode: disabled, instructions: "Использует core nodes актуального ComfyUI."}
    models: {mode: manual, instructions: "Скачать выбранный Klein checkpoint и encoders через Hugging Face Download Manager."}
    launch: {mode: comfyui}
    workflows:
      - {name: flux2_klein_4b_t2i, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_text_to_image.json}
      - {name: flux2_klein_9b_t2i, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_text_to_image_9b.json}
      - {name: flux2_klein_4b_base_edit, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_image_edit_4b_base.json}
      - {name: flux2_klein_4b_distilled_edit, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_image_edit_4b_distilled.json}
      - {name: flux2_klein_9b_base_edit, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_image_edit_9b_base.json}
      - {name: flux2_klein_9b_distilled_edit, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_image_edit_9b_distilled.json}
      - {name: flux2_klein_9b_kv_edit, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_klein_9b_kv_image_edit.json}

  - id: asymflow
    name: AsymFlow / AsymFLUX.2 Klein 9B
    category: "1 · Image generation"
    kind: comfyui
    description: "Pixel-space адаптер для FLUX.2 Klein Base 9B. Это не отдельная программа: ComfyUI-piFlow меняет способ генерации Klein и добавляет AsymFlow scheduler, Oklab pixel-space VAE и live pixel preview."
    source_url: https://github.com/Lakonik/ComfyUI-piFlow
    repo_url: https://github.com/Lakonik/ComfyUI-piFlow
    ref: 1e161f39ef4bf04c9033ed6a6cdc4d8373cc9e72
    priority: must
    adapter_status: ready
    license_note: "ComfyUI-ноды — Apache-2.0; FLUX.2 Klein 9B и AsymFlow adapter — FLUX Non-Commercial License. Для коммерческого использования нужна отдельная лицензия."
    requirements: ["FLUX.2 Klein Base 9B", "Qwen3 8B encoder", "32+ GB VRAM желательно; на меньшей VRAM — GGUF/offload"]
    inputs: [text]
    outputs: [image]
    pipeline: "один prompt → AsymFlow 9B и обычный Klein Base 9B → по 4 одинаковых теста → сравнение реализма, деталей, текста и разнообразия"
    install: {mode: disabled, instructions: "ComfyUI-piFlow v1.3.4 уже встроен в AI Lab image как custom node; отдельная Python-программа и отдельный UI не нужны."}
    models: {mode: manual, instructions: "Общие с Klein: flux-2-klein-base-9b-fp8.safetensors → models/diffusion_models и qwen_3_8b_fp8mixed.safetensors → models/text_encoders. Только для AsymFlow: diffusion_pytorch_model.safetensors из Lakonik/AsymFLUX.2-klein-9B переименовать в asymflux2_klein_9b.safetensors и положить в models/loras. Для обычного Klein baseline дополнительно нужен full_encoder_small_decoder.safetensors в models/vae. BFL checkpoint gated: сначала принять FLUX license на Hugging Face."}
    launch: {mode: comfyui}
    workflows:
      - name: asymflow_flux2_klein_9b
        url: https://raw.githubusercontent.com/Lakonik/ComfyUI-piFlow/main/workflows/asymflux2_klein_9b.json
        model_hints:
          - node_type: "Load AsymFlow Model"
            name: asymflux2_klein_9b.safetensors
            url: https://huggingface.co/Lakonik/AsymFLUX.2-klein-9B/resolve/main/diffusion_pytorch_model.safetensors
            directory: loras
      - {name: baseline_flux2_klein_9b_base, url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/image_flux2_text_to_image_9b.json}

  - id: realgen-v2
    name: RealGen V2
    category: "1 · Image generation"
    kind: modifier
    description: Realism-LoRA для Z-Image, а не самостоятельный генератор.
    source_url: https://github.com/yejy53/RealGen
    priority: must
    adapter_status: catalogued
    requirements: ["Z-Image base", "совместимый LoRA loader"]
    inputs: [text]
    outputs: [image]
    pipeline: "prompt → Z-Image + RealGen LoRA → A/B с чистой базой"
    install: {mode: disabled, instructions: "Код обучения не нужен; LoRA подключается внутри ComfyUI."}
    models: {mode: manual, instructions: "Скачать RealGen V2 LoRA и положить в models/loras; базовый Z-Image хранится отдельно."}
    launch: {mode: comfyui}

  - id: freefuse
    name: FreeFuse
    category: "1 · Image generation"
    kind: modifier
    description: Training-free маршрутизация нескольких subject-LoRA в одной сцене.
    source_url: https://github.com/yaoliliu/FreeFuse
    repo_url: https://github.com/yaoliliu/FreeFuse
    priority: must
    adapter_status: manual
    requirements: ["совместимая база", "2+ subject LoRA"]
    inputs: [text, lora]
    outputs: [image]
    pipeline: "base + несколько LoRA → FreeFuse routing → sampler → PNG"
    install: {mode: manual, instructions: "Установить ветку comfyui через ComfyUI Manager; версия должна совпадать с текущей базой."}
    models: {mode: manual, instructions: "Скачать базовую модель и subject-LoRA вручную."}
    launch: {mode: comfyui}
    workflows:
      - {name: freefuse_zimage_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/zimage_freefuse_complete.json}
      - {name: freefuse_zimage_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/zimage_freefuse_with_editor.json}
      - {name: freefuse_zimage_controlnet_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/controlnet_zimage_freefuse_complete.json}
      - {name: freefuse_zimage_controlnet_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/controlnet_zimage_freefuse_with_editor.json}
      - {name: freefuse_zimage_gguf_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/gguf_zimage_freefuse_complete.json}
      - {name: freefuse_zimage_gguf_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/gguf_zimage_freefuse_with_editor.json}
      - {name: freefuse_flux_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux_freefuse_complete.json}
      - {name: freefuse_flux_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux_freefuse_with_editor.json}
      - {name: freefuse_flux2_klein_4b_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux2_klein_4b_freefuse_complete.json}
      - {name: freefuse_flux2_klein_4b_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux2_klein_4b_freefuse_with_editor.json}
      - {name: freefuse_flux2_klein_9b_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux2_klein_9b_freefuse_complete.json}
      - {name: freefuse_flux2_klein_9b_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/flux2_klein_9b_freefuse_with_editor.json}
      - {name: freefuse_sdxl_complete, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/sdxl_freefuse_complete.json}
      - {name: freefuse_sdxl_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/sdxl_freefuse_with_editor.json}
      - {name: freefuse_krea2_editor, url: https://raw.githubusercontent.com/yaoliliu/FreeFuse/master/freefuse_comfyui/workflows/krea2_freefuse_with_editor.json}

  - id: lucida-v7
    name: Lucida v7
    category: "2 · Image editing"
    kind: comfyui
    description: Специализированное удаление фона и matting для стекла, текста, логотипов и сложных продуктовых краёв.
    source_url: https://github.com/egeorcun/lucida
    priority: must
    adapter_status: catalogued
    requirements: ["NVIDIA GPU или CPU"]
    inputs: [image]
    outputs: [image, mask]
    pipeline: "image → Lucida → RGBA + mask → composite/inpaint"
    install: {mode: disabled, instructions: "Использовать background-removal nodes актуального ComfyUI."}
    models: {mode: manual, instructions: "Скачать lucida.safetensors в models/background_removal."}
    launch: {mode: comfyui}
    workflows:
      - {name: lucida_remove_background, url: https://raw.githubusercontent.com/egeorcun/lucida/main/docs/comfyui/lucida_remove_background.json}

  - id: qwen-image-edit-2511
    name: Qwen-Image-Edit-2511
    category: "2 · Image editing"
